<html>
    <head><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>

        <!-- you can add more classes by adding a space inbtwn them for example <div class="card italic"> italic is the 2nd class that was added-->
        <div class="card dotted-blue-border">
            <img
                src="images/per.png"
                alt="Per Harald Borgen smiling at the camera with a colorful background" class="avatar dotted-blue-border">
            <div class="dotted-blue-border">
                <h3>Per Harald Borgen</h3>
                <p>Frontend Developer</p>
                <h4>Oslo, Norway</h4>
            </div>
        </div>
    </body>
</html>

<!-- Utility class =  is a class for a single CSS property. In this example, its a class that would set the border for elements that use the class -->
